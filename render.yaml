services:

    name: dpr-backend
    runtime: node
    plan: free
    rootDir: dpr-backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false


  - type: static
    name: dpr-frontend
    rootDir: .
    buildCommand: echo "No build step needed"
    publishPath: .
    routes:
      - type: rewrite
        source: /api/(.*)
        destination: https://dpr-backend.onrender.com/api/$1
    envVars:
      - key: BACKEND_URL
        value: https://dpr-backend.onrender.com
