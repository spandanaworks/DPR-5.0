services:
  # ========== BACKEND - Node.js API ==========
  - type: web
    name: dpr-backend
    runtime: node
    plan: free
    rootDir: dpr-backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  # ========== FRONTEND - Static Site ==========
  - type: web
    name: dpr-frontend
    runtime: static
    plan: free
    rootDir: .
    buildCommand: echo "No build step needed"
    publishPath: .
